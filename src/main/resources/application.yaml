spring:
  application:
    name: spring-boot-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/javaspringboot
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # for testing purposes only
    open-in-view: false # this property must be disabled to prevent multiple n + 1 problem
    show-sql: true # visualize sql queries generated by Spring Data Jpa (for test/debug only)
    properties:
      hibernate:
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        order_deletes: true