spring:
  application:
    name: spring-boot-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop # for testing purposes only
    open-in-view: false # this property must be disabled to prevent multiple n + 1 problem
    show-sql: true # visualize sql queries generated by Spring Data Jpa (for test/debug only)